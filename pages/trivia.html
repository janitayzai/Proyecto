<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="trivia">
    <h1>Ahora comprueba lo que aprendiste</h1>
    <h3>Contesta las siguientes preguntas sobre la vida del santo</h3>
     <div id="inicio">
    <p>Responde las 5 preguntas y descubre cuánto sabes.</p>
    <button id="btn-iniciar">Comenzar</button>
  </div>

  <div id="juego" hidden>
    <p id="progreso"></p>
    <h3 id="pregunta"></h3>
    <div id="opciones"></div>
    <p id="feedback"></p>
    <button id="btn-siguiente" hidden>Siguiente</button>
  </div>

  <div id="resultado" hidden>
    <h3 id="puntaje"></h3>
    <p id="mensaje"></p>
    <button id="btn-reiniciar">Volver a intentar</button>
  </div>
</section>
    <script src="./js/javascript.js"></script>
    
</body>
</html>
